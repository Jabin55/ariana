<!DOCTYPE html>
<html lang="ko">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    :root {
      --bg: #fdf6e9; --card: #fff; --ink: #2b2b2b; --muted: #7a7266; --line: #ece3d3;
      --accent: #ff7a59; --ai-bg: #eaf4ff; --ai-ink: #2560b5; --err: #c0392b;
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink);
      background: var(--bg) radial-gradient(#e9dcc4 1.2px, transparent 1.2px) 0 0 / 22px 22px;
      font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }
    header { padding: 20px 16px 8px; max-width: 1200px; margin: 0 auto; }
    .hero { display: flex; align-items: center; gap: 16px; border-radius: 20px; padding: 18px 22px;
      background: linear-gradient(120deg, #ffd56b 0%, #ff9f7a 55%, #ff7aa8 100%);
      box-shadow: 0 4px 14px rgba(255,122,89,.25); }
    .hero .mascot { width: 96px; height: 96px; flex: none; filter: drop-shadow(0 3px 4px rgba(0,0,0,.18)); }
    .hero img.mascot { object-fit: contain; }
    h1 { margin: 0 0 8px; font-size: 26px; color: #3a2414; }
    .bubble { position: relative; display: inline-block; background: #fff; border-radius: 14px;
      padding: 8px 12px; font-size: 14px; color: #5a3d2b; box-shadow: 0 2px 6px rgba(0,0,0,.08); }
    .bubble::before { content: ''; position: absolute; left: -7px; top: 12px; border: 7px solid transparent;
      border-left: 0; border-right-color: #fff; }
    @media (max-width: 520px) { .hero .mascot { width: 68px; height: 68px; } h1 { font-size: 21px; } }
    main { padding: 8px 16px 40px; max-width: 1200px; margin: 0 auto; }

    .composer { background: var(--card); border-radius: 12px; padding: 14px; margin-bottom: 18px;
      box-shadow: 0 1px 3px rgba(0,0,0,.08); display: grid; gap: 8px; }
    input, textarea { width: 100%; font: inherit; padding: 9px 10px; border: 1px solid var(--line);
      border-radius: 8px; background: #fff; }
    textarea { resize: vertical; min-height: 70px; }
    .row { display: flex; gap: 8px; align-items: center; }
    .row input { flex: 1; }
    button { font: inherit; border: 0; border-radius: 8px; padding: 9px 16px; cursor: pointer;
      background: var(--accent); color: #fff; white-space: nowrap; }
    button:disabled { opacity: .5; cursor: default; }
    button.link { background: none; color: var(--accent); padding: 4px 0; justify-self: start; }

    .board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; align-items: start; }
    @media (max-width: 1000px) { .board { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 560px) { .board { grid-template-columns: 1fr; } }
    .col-head { position: sticky; top: 0; z-index: 1; display: flex; justify-content: space-between; align-items: center;
      background: var(--tone); color: #2b2b2b; font-weight: 700; font-size: 17px; border-radius: 14px;
      padding: 12px 14px; margin-bottom: 12px; box-shadow: 0 2px 6px rgba(0,0,0,.08); }
    .col-head .count { font-size: 13px; background: rgba(255,255,255,.7); border-radius: 999px; padding: 2px 9px; }
    .col-empty { color: var(--muted); font-size: 13px; text-align: center; padding: 14px 0; }
    .sorting { margin-top: 24px; }
    .finder { background: var(--card); border-radius: 12px; padding: 12px 14px; margin-bottom: 16px;
      box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .finder .row input { max-width: 260px; }
    .names { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; max-height: 92px; overflow-y: auto; }
    .name { font: inherit; font-size: 13px; padding: 4px 10px; border-radius: 999px; background: #f3ece0; color: #4a3b2c; }
    .name b { font-weight: 700; color: var(--accent); margin-left: 3px; }
    .name.on { background: var(--accent); color: #fff; }
    .name.on b { color: #fff; }
    .filter-note { margin-top: 10px; font-size: 14px; }
    .filter-note button { margin-left: 6px; }
    .sorting .label { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
    .sorting .cards { columns: 280px; column-gap: 14px; }
    .tone-0 { --tone: #8fd3a8; } .tone-1 { --tone: #8cc4ff; } .tone-2 { --tone: #ffd56b; } .tone-3 { --tone: #c3a6ff; }
    .tone-x { --tone: #e2d6c2; }
    .card { break-inside: avoid; background: var(--card); border-radius: 14px; padding: 14px;
      margin-bottom: 16px; box-shadow: 0 2px 6px rgba(0,0,0,.07); border-top: 6px solid var(--tone, #ffd56b); }

    .meta { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .q { white-space: pre-wrap; word-break: break-word; font-size: 16px; line-height: 1.5; }
    .comments { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 8px; display: grid; gap: 8px; }
    .c { font-size: 14px; line-height: 1.55; word-break: break-word; }
    .c .who { font-weight: 600; font-size: 12px; margin-bottom: 2px; display: flex; align-items: center; gap: 6px; }
    .c .av { width: 26px; height: 26px; flex: none; border-radius: 50%; background: #fff; object-fit: contain; }
    .c.ai { background: var(--ai-bg); border-radius: 8px; padding: 8px 10px; }
    .c.ai .who { color: var(--ai-ink); }
    .c .body { white-space: pre-wrap; }
    .pending { font-size: 13px; color: var(--ai-ink); }
    .error { font-size: 13px; color: var(--err); }
    .reply { margin-top: 8px; display: none; gap: 6px; }
    .reply.open { display: grid; }
    .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #333;
      color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 14px; display: none; }
  </style>
</head>
<body>
  <!-- AI 선생님 캐릭터 (부엉이). 스크립트 속성 CHARACTER_IMAGE_URL 을 넣으면 그 이미지로 바뀝니다. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="owl" viewBox="0 0 120 120">
      <polygon points="28,34 36,10 50,28" fill="#7a4e2d"/>
      <polygon points="92,34 84,10 70,28" fill="#7a4e2d"/>
      <ellipse cx="60" cy="70" rx="40" ry="44" fill="#9a6640"/>
      <ellipse cx="22" cy="78" rx="10" ry="22" fill="#7a4e2d" transform="rotate(15 22 78)"/>
      <ellipse cx="98" cy="78" rx="10" ry="22" fill="#7a4e2d" transform="rotate(-15 98 78)"/>
      <ellipse cx="60" cy="86" rx="24" ry="26" fill="#f6dcb4"/>
      <path d="M48 80 q4 4 8 0 M58 88 q4 4 8 0 M50 96 q4 4 8 0 M62 78 q4 4 8 0" stroke="#d9b98c" stroke-width="2" fill="none"/>
      <circle cx="43" cy="52" r="15" fill="#fff"/>
      <circle cx="77" cy="52" r="15" fill="#fff"/>
      <circle cx="45" cy="54" r="7" fill="#2b2b2b"/>
      <circle cx="75" cy="54" r="7" fill="#2b2b2b"/>
      <circle cx="47" cy="51" r="2.4" fill="#fff"/>
      <circle cx="77" cy="51" r="2.4" fill="#fff"/>
      <circle cx="43" cy="52" r="16" fill="none" stroke="#2b2b2b" stroke-width="3"/>
      <circle cx="77" cy="52" r="16" fill="none" stroke="#2b2b2b" stroke-width="3"/>
      <line x1="59" y1="52" x2="61" y2="52" stroke="#2b2b2b" stroke-width="3"/>
      <polygon points="54,64 66,64 60,74" fill="#ff9f1c"/>
      <ellipse cx="44" cy="113" rx="8" ry="4" fill="#ff9f1c"/>
      <ellipse cx="76" cy="113" rx="8" ry="4" fill="#ff9f1c"/>
      <polygon points="60,2 98,16 60,30 22,16" fill="#33334d"/>
      <rect x="44" y="20" width="32" height="12" rx="3" fill="#33334d"/>
      <path d="M90 19 v14" stroke="#ffd23f" stroke-width="3"/>
      <circle cx="90" cy="35" r="4" fill="#ffd23f"/>
    </symbol>
  </svg>

  <header>
    <div class="hero">
      <? if (characterUrl) { ?>
        <img class="mascot" src="<?= characterUrl ?>" alt="">
      <? } else { ?>
        <svg class="mascot" role="img" aria-label="AI 선생님 캐릭터"><use href="#owl"/></svg>
      <? } ?>
      <div>
        <h1><?= boardTitle ?></h1>
        <div class="bubble">사회와 문화, 정치, 경제, 법과 사회에 관해 물어보세요.</div>
      </div>
    </div>
  </header>

  <main>
    <form class="composer" id="composer">
      <textarea id="qText" maxlength="1000" placeholder="궁금한 것을 적어 주세요" required></textarea>
      <div class="row">
        <input id="qName" maxlength="30" placeholder="이름 (비우면 익명)">
        <button id="qSubmit" type="submit">질문 올리기</button>
      </div>
    </form>

    <div class="finder">
      <div class="row">
        <input id="nameSearch" placeholder="🔍 이름으로 질문 찾기">
      </div>
      <div class="names" id="names"></div>
      <div class="filter-note" id="filterNote" style="display:none"></div>
    </div>

    <div id="grid"></div>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    var REFRESH_MS = 10000;
    var CATEGORIES = ['사회와 문화', '정치', '경제', '법과 사회'];
    var CHARACTER_URL = <?!= JSON.stringify(characterUrl) ?>;
    var AVATAR = CHARACTER_URL
      ? '<img class="av" src="' + CHARACTER_URL.replace(/"/g, '&quot;') + '" alt="">'
      : '<svg class="av" viewBox="0 0 120 120"><use href="#owl"/></svg>';
    var grid = document.getElementById('grid');
    var openReplies = {};   // 댓글 입력창을 열어 둔 글 (새로고침해도 유지)
    var drafts = {};        // 작성 중인 댓글 내용
    var localPending = [];  // 서버 저장 전, 화면에 먼저 보여 주는 내 질문
    var lastPosts = [];
    var nameFilter = '';    // 이름 색인에서 고른 사람 (정확히 일치)
    var nameQuery = '';     // 검색칸에 입력한 글자 (부분 일치)

    // 이름은 이 브라우저에 기억해 둡니다.
    var nameInput = document.getElementById('qName');
    try { nameInput.value = localStorage.getItem('qna-name') || ''; } catch (e) {}
    nameInput.addEventListener('change', function () {
      try { localStorage.setItem('qna-name', nameInput.value); } catch (e) {}
    });

    function esc(s) {
      return String(s).replace(/[&<>"']/g, function (ch) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
      });
    }
    // AI 답변의 **굵게** 정도만 살립니다. (그 외 HTML은 모두 이스케이프)
    function fmt(s) {
      return esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/^\s*[*-] /gm, '• ');
    }
    function when(iso) {
      var d = new Date(iso);
      if (isNaN(d)) return '';
      return (d.getMonth() + 1) + '/' + d.getDate() + ' ' +
        d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0');
    }
    function toast(msg) {
      var t = document.getElementById('toast');
      t.textContent = msg; t.style.display = 'block';
      clearTimeout(toast.timer);
      toast.timer = setTimeout(function () { t.style.display = 'none'; }, 3500);
    }
    function errMsg(e) { return (e && e.message) ? e.message : String(e); }

    function render(posts) {
      // 다시 그리기 전에 작성 중인 댓글을 보관
      grid.querySelectorAll('.reply textarea').forEach(function (ta) { drafts[ta.dataset.id] = ta.value; });

      lastPosts = posts;
      // 서버에 이미 저장된 내 질문은 임시 카드 대신 서버 카드로 보여 줌
      var mine = localPending.filter(function (lp) {
        return !posts.some(function (p) { return p.text === lp.text && p.author === lp.author; });
      });
      renderNames(posts);
      var all = mine.concat(posts).filter(matchesName);
      var note = document.getElementById('filterNote');
      if (nameFilter || nameQuery) {
        note.style.display = 'block';
        note.innerHTML = '<b>' + esc(nameFilter || nameQuery) + '</b>' + (nameFilter ? '' : ' (이)가 들어간 이름') +
          '의 질문 ' + all.length + '개' + '<button class="link" id="clearFilter">전체 보기</button>';
      } else {
        note.style.display = 'none';
      }
      var cols = CATEGORIES.map(function () { return []; });
      var sorting = [];
      all.forEach(function (p) {
        var i = CATEGORIES.indexOf(p.category);
        (i === -1 ? sorting : cols[i]).push(p);
      });

      var html = '';
      var sortingHtml = '';
      if (sorting.length) {
        sortingHtml = '<div class="sorting"><div class="label">아직 분류되지 않은 질문</div>' +
          '<div class="cards">' + sorting.map(function (p) { return card(p, 'x'); }).join('') + '</div></div>';
      }
      html += '<div class="board">' + CATEGORIES.map(function (name, i) {
        return '<section class="tone-' + i + '">' +
          '<div class="col-head">' + esc(name) + '<span class="count">' + cols[i].length + '</span></div>' +
          (cols[i].length ? cols[i].map(function (p) { return card(p, i); }).join('')
                          : '<div class="col-empty">아직 질문이 없어요</div>') +
          '</section>';
      }).join('') + '</div>';
      grid.innerHTML = html + sortingHtml;
    }

    function matchesName(p) {
      if (nameFilter) return p.author === nameFilter;
      if (nameQuery) return p.author.toLowerCase().indexOf(nameQuery.toLowerCase()) !== -1;
      return true;
    }

    // 질문한 사람 이름 색인 (질문 많은 순, 같으면 가나다순)
    function renderNames(posts) {
      var counts = {};
      posts.forEach(function (p) { counts[p.author] = (counts[p.author] || 0) + 1; });
      var names = Object.keys(counts).filter(function (n) {
        return !nameQuery || n.toLowerCase().indexOf(nameQuery.toLowerCase()) !== -1;
      }).sort(function (a, b) { return counts[b] - counts[a] || a.localeCompare(b, 'ko'); });
      document.getElementById('names').innerHTML = names.map(function (n) {
        return '<button type="button" class="name' + (n === nameFilter ? ' on' : '') + '" data-name="' + esc(n) + '">' +
          esc(n) + '<b>' + counts[n] + '</b></button>';
      }).join('') || '<span class="meta">아직 질문한 사람이 없어요</span>';
    }

    function card(p, toneIdx) {
        var comments = p.comments.map(function (c) {
          return '<div class="c' + (c.isAI ? ' ai' : '') + '">' +
            '<div class="who">' + (c.isAI ? AVATAR : '') + esc(c.author) +
            ' <span class="meta">' + when(c.createdAt) + '</span></div>' +
            '<div class="body">' + (c.isAI ? fmt(c.text) : esc(c.text)) + '</div></div>';
        }).join('');
        var state = '';
        if (p.status === 'pending') state = '<div class="pending">✏️ AI 선생님이 답변을 쓰고 있어요…</div>';
        if (p.status === 'error') state = '<div class="error">AI 답변을 받지 못했어요. ' +
          '<button class="link" data-retry="' + esc(p.id) + '">다시 받기</button></div>';
        var replyBox = p.local ? '' :
          '<button class="link" data-toggle="' + esc(p.id) + '">댓글 달기</button>' +
          '<div class="reply' + (openReplies[p.id] ? ' open' : '') + '">' +
          '<textarea data-id="' + esc(p.id) + '" maxlength="1000" placeholder="댓글">' +
          esc(drafts[p.id] || '') + '</textarea>' +
          '<button data-send="' + esc(p.id) + '">댓글 등록</button></div>';
        return '<div class="card tone-' + toneIdx + '">' +
          '<div class="meta">' + esc(p.author) + ' · ' + when(p.createdAt) + '</div>' +
          '<div class="q">' + esc(p.text) + '</div>' +
          '<div class="comments">' + comments + state + replyBox + '</div></div>';
    }

    function refresh() {
      google.script.run
        .withSuccessHandler(render)
        .withFailureHandler(function (e) { console.error(e); })
        .getBoard();
    }

    document.getElementById('composer').addEventListener('submit', function (ev) {
      ev.preventDefault();
      var textEl = document.getElementById('qText');
      var text = textEl.value.trim();
      if (!text) return;
      var name = nameInput.value.trim();
      var btn = document.getElementById('qSubmit');
      btn.disabled = true;

      var temp = { id: 'local-' + Date.now(), local: true, author: name || '익명',
        text: text, createdAt: new Date().toISOString(), status: 'pending', comments: [] };
      localPending.unshift(temp);
      textEl.value = '';
      render(lastPosts); // 서버 응답 전에 내 질문을 바로 보여 줌
      btn.disabled = false;

      google.script.run
        .withSuccessHandler(function () { localPending.splice(localPending.indexOf(temp), 1); refresh(); })
        .withFailureHandler(function (e) {
          localPending.splice(localPending.indexOf(temp), 1);
          textEl.value = text;
          toast('질문을 올리지 못했어요: ' + errMsg(e));
          refresh();
        })
        .addPost(name, text);
    });

    document.getElementById('nameSearch').addEventListener('input', function (ev) {
      nameQuery = ev.target.value.trim();
      nameFilter = '';
      render(lastPosts);
    });
    document.querySelector('.finder').addEventListener('click', function (ev) {
      var btn = ev.target.closest('button');
      if (!btn) return;
      if (btn.id === 'clearFilter') {
        nameFilter = ''; nameQuery = '';
        document.getElementById('nameSearch').value = '';
      } else if (btn.dataset.name != null) {
        nameFilter = nameFilter === btn.dataset.name ? '' : btn.dataset.name;
      }
      render(lastPosts);
    });

    grid.addEventListener('click', function (ev) {
      var t = ev.target;
      if (t.dataset.toggle) {
        var id = t.dataset.toggle;
        openReplies[id] = !openReplies[id];
        t.nextElementSibling.classList.toggle('open', openReplies[id]);
        if (openReplies[id]) t.nextElementSibling.querySelector('textarea').focus();
      } else if (t.dataset.send) {
        var pid = t.dataset.send;
        var ta = t.parentNode.querySelector('textarea');
        var text = ta.value.trim();
        if (!text) return;
        t.disabled = true;
        google.script.run
          .withSuccessHandler(function (aiReplies) {
            drafts[pid] = ''; ta.value = ''; openReplies[pid] = false; refresh();
            if (aiReplies) {
              google.script.run.withSuccessHandler(refresh).withFailureHandler(refresh).retryAnswer(pid);
            }
          })
          .withFailureHandler(function (e) { t.disabled = false; toast('댓글을 올리지 못했어요: ' + errMsg(e)); })
          .addComment(pid, nameInput.value.trim(), text);
      } else if (t.dataset.retry) {
        t.disabled = true;
        t.textContent = '요청 중…';
        google.script.run
          .withSuccessHandler(refresh)
          .withFailureHandler(function (e) { toast('다시 받기 실패: ' + errMsg(e)); refresh(); })
          .retryAnswer(t.dataset.retry);
      }
    });

    refresh();
    setInterval(function () { if (!document.hidden) refresh(); }, REFRESH_MS);
  </script>
</body>
</html>
