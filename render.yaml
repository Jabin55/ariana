services:
  - type: web
    name: politics-chatbot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ANTHROPIC_API_KEY
        sync: false  # 배포할 때 Render 화면에서 직접 입력
      # ── 실시간 수업(/live) ──
      - key: SECRET_KEY
        generateValue: true  # Render가 무작위 값을 만들어 준다
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: ALLOWED_DOMAINS
        sync: false
      - key: TEACHER_EMAILS
        sync: false
      - key: SCHOOLS
        sync: false
      - key: DATABASE_URL
        sync: false  # Neon 무료 PostgreSQL 주소
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
