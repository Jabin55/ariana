# Render 배포 설정: 사이트 두 개를 따로 만든다 (같은 코드, 다른 주소).
#   politics-chatbot → https://politics-chatbot-….onrender.com  (정치쌤 챗봇)
#   live-class       → https://live-class-….onrender.com        (실시간 수업, 첫 주소가 바로 수업 화면)
# 주소의 앞부분은 서비스 이름(name)으로 정해진다. 바꾸고 싶으면 name 을 고치거나 Render 화면에서 바꾸면 된다.
services:
  - type: web
    name: politics-chatbot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ANTHROPIC_API_KEY
        sync: false  # 배포할 때 Render 화면에서 직접 입력

  - type: web
    name: live-class
    runtime: python
    plan: free
    # 학생 개인정보(회원·출결·질문·점수)를 다루므로 EU(독일)에 둔다.
    # EU는 2025년 9월 개인정보보호위원회가 국내와 동등한 보호 수준으로 인정해 별도 동의 없이 이전할 수 있다.
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: APP_MODE
        value: live
      - key: ANTHROPIC_API_KEY
        sync: false  # AI 조교용 (비워 두면 AI 조교만 동작하지 않음)
      - key: SECRET_KEY
        generateValue: true  # Render가 무작위 값을 만들어 준다
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: ALLOWED_DOMAINS
        sync: false
      - key: ADMIN_EMAILS
        sync: false  # 전체 관리자 이메일 (거점학교 관리교사를 승인, 쉼표로 여러 개)
      - key: TEACHER_EMAILS
        sync: false  # (선택) 신청 없이 바로 강사가 되는 이메일
      - key: SCHOOLS
        sync: false
      - key: DATABASE_URL
        sync: false  # Neon 무료 PostgreSQL 주소
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
