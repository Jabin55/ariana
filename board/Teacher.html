<!DOCTYPE html>
<html lang="ko">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    :root {
      --bg: #fdf6e9; --card: #fff; --ink: #2b2b2b; --muted: #6f675b; --line: #ece3d3;
      --accent: #ff7a59; --err: #c0392b; --surface: #fcfcfb;
      /* 그래프 색: 항목마다 고정된 순서로 씁니다 (색맹 구분 검증된 순서) */
      --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
      --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948; --none: #c9c4ba; --nocomp: #a39c8f;
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--bg);
      font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }
    header { max-width: 1200px; margin: 0 auto; padding: 20px 16px 8px; }
    .hero { position: relative; border-radius: 18px; padding: 16px 20px;
      background: linear-gradient(120deg, #ffd56b 0%, #ff9f7a 55%, #ff7aa8 100%); }
    h1 { margin: 0; font-size: 22px; color: #3a2414; }
    .top-actions { position: absolute; top: 12px; right: 14px; display: flex; gap: 6px; }
    .back, #logout { font: inherit; font-size: 13px; text-decoration: none; color: #5a3d2b; cursor: pointer;
      background: rgba(255,255,255,.7); border: 0; border-radius: 999px; padding: 5px 12px; }
    .back:hover, #logout:hover { background: #fff; }
    @media (max-width: 520px) { .hero { padding-top: 40px; } }
    .sub { margin-top: 4px; font-size: 13px; color: #4a2e1c; }
    main { max-width: 1200px; margin: 0 auto; padding: 8px 16px 48px; }
    .panel { background: var(--card); border-radius: 12px; padding: 14px 16px; margin-bottom: 16px;
      box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    h2 { margin: 0 0 10px; font-size: 16px; }
    .hint { font-size: 12px; color: var(--muted); margin: -4px 0 10px; line-height: 1.5; }
    input, select, button { font: inherit; }
    input, select { padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; background: #fff; max-width: 100%; }
    button { border: 0; border-radius: 8px; padding: 8px 14px; cursor: pointer; background: var(--accent); color: #fff; white-space: nowrap; }
    button.ghost { background: #f3ece0; color: #4a3b2c; }
    .err { color: var(--err); font-size: 14px; margin-top: 8px; }

    #gate { max-width: 380px; margin: 40px auto; }
    #gate .row { display: flex; gap: 8px; }
    #gate input { flex: 1; }

    .controls { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
    .controls label { word-break: keep-all; font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
    .stats { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
    .stat { background: #faf5ec; border-radius: 10px; padding: 8px 14px; font-size: 13px; color: var(--muted); }
    .stat b { display: block; font-size: 20px; color: var(--ink); }

    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
    @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
    /* 가로 막대그래프: 이름 | 막대(전체 질문 대비 비율) | 개수·비율 */
    .bars { --l1: #86b6ef; --l2: #5598e7; --l3: #2a78d6; --l4: #1c5cab; --l5: #184f95; --l6: #0d366b; }
    .brow { display: grid; grid-template-columns: minmax(84px, 36%) minmax(0, 1fr) 84px; gap: 10px; align-items: center;
      padding: 5px 6px; border-radius: 6px; font-size: 13px; }
    .brow.pickable { cursor: pointer; }
    .brow.pickable:hover, .brow.on { background: #f6efe3; }
    .bars.has-pick .brow:not(.on) .bar { opacity: .3; }
    .brow .name { word-break: keep-all; line-height: 1.35; }
    .brow .track { height: 14px; background: #f5f0e8; border-radius: 0 4px 4px 0; }
    .brow .bar { height: 100%; border-radius: 0 4px 4px 0; transition: opacity .15s; }
    .brow .n { color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .stack { display: grid; gap: 16px; }
    .stack .panel { margin-bottom: 0; }
    .grid { margin-bottom: 16px; }
    .grid > .panel { margin-bottom: 0; }
    .units { display: grid; grid-template-columns: 1fr; gap: 18px; }
    .units h3 { margin: 0 0 6px; font-size: 14px; }
    .empty { color: var(--muted); font-size: 13px; padding: 10px 0; }
    #tip { position: fixed; pointer-events: none; background: #2b2b2b; color: #fff; font-size: 12px;
      padding: 6px 9px; border-radius: 6px; display: none; z-index: 10; max-width: 300px; white-space: pre-line; }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 600; white-space: nowrap; }
    td.num { font-variant-numeric: tabular-nums; }
    td.nw { white-space: nowrap; }
    td.muted-cell { color: var(--muted); font-size: 12px; }
    tr.click { cursor: pointer; }
    tr.click:hover { background: #faf5ec; }
    .table-wrap { overflow-x: auto; }
    .chip { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px; background: #f3ece0;
      color: #4a3b2c; margin: 1px 2px 1px 0; white-space: nowrap; }
    .q { line-height: 1.5; word-break: break-word; }
    /* 미분류 칸: 선생님이 직접 고르는 드롭다운 */
    select.fix { font-size: 12px; padding: 3px 6px; border: 1px dashed var(--accent); background: #fff8f4; max-width: 160px; }
    select.fix:disabled { opacity: .5; }
    /* 이미 분류된 칸: 눈에 덜 띄는 드롭다운으로 바꿀 수 있음 */
    select.fix.done { border: 1px solid transparent; background: transparent; padding: 3px 4px; color: var(--ink); cursor: pointer; }
    select.fix.done:hover, select.fix.done:focus { border-color: var(--line); background: #fff; }
    /* 역량: 체크박스로 여러 개 고르기 */
    .cpick { position: relative; display: inline-block; }
    .cpick > button { font: inherit; font-size: 12px; text-align: left; padding: 3px 6px; border-radius: 8px; cursor: pointer;
      background: transparent; color: var(--ink); border: 1px solid transparent; max-width: 220px; }
    .cpick > button:hover { border-color: var(--line); background: #fff; }
    .cpick.empty > button { border: 1px dashed var(--accent); background: #fff8f4; }
    .cpick .menu { position: fixed; z-index: 20; width: 230px; padding: 8px 10px;
      background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 6px 18px rgba(0,0,0,.12); }
    .cpick .menu label { display: flex; gap: 6px; align-items: flex-start; font-size: 12px; padding: 3px 0; cursor: pointer; }
    .cpick .menu label.none { border-top: 1px solid var(--line); margin-top: 4px; padding-top: 7px; }
    .cpick .menu .row { display: flex; justify-content: flex-end; gap: 6px; margin-top: 8px; }
    .cpick .menu button { font-size: 12px; padding: 4px 10px; }
    .fix-err { display: block; color: var(--err); font-size: 11px; margin-top: 2px; }
    .pick-note { font-size: 13px; margin-bottom: 8px; }
    .pick-note button { padding: 3px 10px; margin-left: 6px; font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <div class="hero">
      <div class="top-actions">
        <? if (boardUrl) { ?><a class="back" href="<?= boardUrl ?>">← 질문 게시판</a><? } ?>
        <button type="button" id="logout" hidden>로그아웃</button>
      </div>
      <h1>학생 분석</h1>
      <div class="sub"><?= boardTitle ?> · 선생님 전용 화면</div>
    </div>
  </header>
  <main>
    <section id="gate" class="panel">
      <h2>교사 로그인</h2>
      <p class="hint">로그인하면 이 브라우저 창을 닫을 때까지 유지돼요.</p>
      <form class="row" id="gateForm">
        <input id="pw" type="password" autocomplete="current-password" required>
        <button id="pwBtn">로그인</button>
      </form>
      <div class="err" id="gateErr"></div>
    </section>

    <div id="app" hidden>
      <section class="panel">
        <div class="controls">
          <label>보기
            <select id="fStudent"><option value="">학생 전체</option></select>
          </label>
          <label>과목
            <select id="fSubject"><option value="">전체</option></select>
          </label>
          <label>기간 <input type="date" id="fFrom"> ~ <input type="date" id="fTo"></label>
          <button class="ghost" id="reload">새로고침</button>
        </div>
        <div class="stats" id="stats"></div>
      </section>

      <!-- 왼쪽: 역량 · 과목 · 인지적 수준 / 오른쪽: 대단원별 비중 (세로로 길게) -->
      <div class="grid">
        <div class="stack">
          <section class="panel">
            <h2>사회과 교과 역량</h2>
            <div id="cComp"></div>
          </section>
          <section class="panel">
            <h2>질문 과목</h2>
            <div id="cCategory"></div>
          </section>
          <section class="panel">
            <h2>인지적 수준</h2>
            <div id="cLevel"></div>
          </section>
        </div>
        <section class="panel">
          <h2>대단원별 비중</h2>
          <div class="units" id="cUnits"></div>
        </section>
      </div>

      <section class="panel" id="studentsPanel">
        <h2>학생별 현황</h2>
        <p class="hint">이름을 누르면 그 학생의 분석을 볼 수 있어요.</p>
        <div class="table-wrap"><table id="students"></table></div>
      </section>

      <section class="panel">
        <h2>질문 목록</h2>
        <p class="hint">그래프의 막대를 누르면 해당 질문만 보여요. 미분류 칸은 드롭다운에서 골라 직접 분류할 수 있어요. 분류는 AI가 한 것이라 틀릴 수 있어요.</p>
        <div class="pick-note" id="pickNote"></div>
        <div class="table-wrap"><table id="questions"></table></div>
      </section>

      <section class="panel">
        <h2>댓글 목록</h2>
        <div class="pick-note" id="pickNoteC"></div>
        <div class="table-wrap"><table id="comments"></table></div>
      </section>
    </div>
  </main>
  <div id="tip"></div>

  <script>
    var SLOTS = ['var(--s1)', 'var(--s2)', 'var(--s3)', 'var(--s4)', 'var(--s5)', 'var(--s6)', 'var(--s7)', 'var(--s8)'];
    var NONE = '미분류';
    var NOCOMP = '드러난 역량 없음';
    var HIGH_LEVELS = ['분석', '종합', '평가'];
    var data = null;
    var state = { student: '', subject: '', from: '', to: '', pick: null };

    function $(id) { return document.getElementById(id); }
    function el(tag, attrs, kids) {
      var n = document.createElement(tag);
      Object.keys(attrs || {}).forEach(function (k) {
        if (k === 'text') n.textContent = attrs[k];
        else if (k === 'cls') n.className = attrs[k];
        else if (k.indexOf('on') === 0) n.addEventListener(k.slice(2), attrs[k]);
        else n.setAttribute(k, attrs[k]);
      });
      (kids || []).forEach(function (c) { if (c) n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
      return n;
    }
    function store(k, v) { try { if (v == null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch (e) {} }
    function load(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }
    function localDate(iso) {
      var d = new Date(iso);
      if (isNaN(d)) return '';
      return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
    }

    /* ── 비밀번호 ── */
    function openAnalysis(pw) {
      $('pwBtn').disabled = true;
      $('gateErr').textContent = '';
      google.script.run
        .withSuccessHandler(function (res) {
          $('pwBtn').disabled = false;
          store('teacherPw', pw);
          data = res;
          prepareComments();
          $('gate').hidden = true;
          $('app').hidden = false;
          $('logout').hidden = false;
          setupControls();
          render();
        })
        .withFailureHandler(function (err) {
          $('pwBtn').disabled = false;
          store('teacherPw', null);
          $('gate').hidden = false;
          $('app').hidden = true;
          $('logout').hidden = true;
          $('gateErr').textContent = (err && err.message || String(err)).replace(/^Error:\s*/, '');
        })
        .getAnalysis(pw);
    }
    $('logout').addEventListener('click', function () {
      store('teacherPw', null);
      data = null;
      $('app').hidden = true;
      $('logout').hidden = true;
      $('gate').hidden = false;
      $('pw').value = '';
      $('pw').focus();
    });
    $('gateForm').addEventListener('submit', function (e) { e.preventDefault(); openAnalysis($('pw').value); });
    $('reload').addEventListener('click', function () { var pw = load('teacherPw'); if (pw) openAnalysis(pw); });
    (function () { var pw = load('teacherPw'); if (pw) openAnalysis(pw); else $('pw').focus(); })();

    /* ── 필터 ── */
    /** 학생 댓글에 댓글이 달린 글의 과목·대단원·질문을 붙여 둡니다. */
    function prepareComments() {
      var byId = {};
      data.posts.forEach(function (p) { p.kind = 'post'; byId[p.id] = p; });
      data.comments = (data.comments || []).filter(function (c) { return byId[c.postId]; });
      data.comments.forEach(function (c) {
        var p = byId[c.postId];
        c.kind = 'comment';
        c.category = p.category;
        c.unit = p.unit;
        c.postText = p.text;
      });
    }

    function setupControls() {
      var names = {}, cnames = {};
      data.posts.forEach(function (p) { names[p.author] = (names[p.author] || 0) + 1; });
      data.comments.forEach(function (c) { cnames[c.author] = (cnames[c.author] || 0) + 1; if (!names[c.author]) names[c.author] = 0; });
      var sel = $('fStudent');
      var keep = state.student;
      sel.innerHTML = '';
      sel.appendChild(el('option', { value: '', text: '학생 전체' }));
      Object.keys(names).sort(function (a, b) { return a.localeCompare(b, 'ko'); }).forEach(function (n) {
        sel.appendChild(el('option', { value: n, text: n + ' (질문 ' + names[n] + (cnames[n] ? ' · 댓글 ' + cnames[n] : '') + ')' }));
      });
      sel.value = names[keep] !== undefined ? keep : '';
      state.student = sel.value;

      var sub = $('fSubject');
      if (sub.options.length === 1) data.categories.forEach(function (c) { sub.appendChild(el('option', { value: c, text: c })); });
    }
    $('fStudent').addEventListener('change', function () { state.student = this.value; state.pick = null; render(); });
    $('fSubject').addEventListener('change', function () { state.subject = this.value; state.pick = null; render(); });
    $('fFrom').addEventListener('change', function () { state.from = this.value; render(); });
    $('fTo').addEventListener('change', function () { state.to = this.value; render(); });

    function basePosts() { return baseFilter(data.posts); }
    function baseComments() { return baseFilter(data.comments); }
    function baseFilter(list) {
      return list.filter(function (p) {
        if (state.student && p.author !== state.student) return false;
        if (state.subject && p.category !== state.subject) return false;
        var d = localDate(p.createdAt);
        if (state.from && d < state.from) return false;
        if (state.to && d > state.to) return false;
        return true;
      });
    }
    function matchesPick(p) {
      var k = state.pick;
      if (!k) return true;
      if (k.type === 'category') return (p.category || NONE) === k.value;
      if (k.type === 'level') return (p.level || NONE) === k.value;
      if (k.type === 'unit') return p.category === k.subject && (p.unit || NONE) === k.value;
      if (k.type === 'comp') {
        if (k.value === NOCOMP) return p.noCompetency;
        if (k.value === NONE) return !p.competencies.length && !p.noCompetency;
        return p.competencies.indexOf(k.value) !== -1;
      }
      return true;
    }
    function setPick(pick) {
      var same = state.pick && pick && state.pick.type === pick.type && state.pick.value === pick.value &&
        state.pick.subject === pick.subject;
      state.pick = same ? null : pick;
      render();
    }

    // 막대가 아닌 빈 곳(그래프 칸의 여백, 제목, 화면 배경)을 누르면 선택을 풀고 전체 질문을 보여 줍니다.
    // 질문 목록·학생 표·필터 같은 곳을 누를 때는 그대로 둡니다.
    document.addEventListener('click', function (e) {
      // 역량 체크박스 목록은 바깥을 누르면 닫습니다.
      if (!e.target.closest('.cpick')) document.querySelectorAll('.cpick .menu').forEach(function (m) { m.remove(); });
      if (!state.pick || !data) return;
      if (e.target.closest('.brow.pickable, button, select, input, a, label, #questions, #comments, #students')) return;
      setPick(null);
    });
    window.addEventListener('scroll', function () {
      document.querySelectorAll('.cpick .menu').forEach(function (m) { if (m.place) m.place(); });
    }, true);

    /* ── 그리기 ── */
    function render() {
      var posts = basePosts();
      var comments = baseComments();
      $('fStudent').value = state.student;
      renderStats(posts, comments);
      renderCategory(posts);
      renderComp(comments); // 역량은 학생 댓글로만 봅니다
      renderLevels(posts.concat(comments));
      renderUnits(posts);
      renderStudents(posts, comments);
      // 역량 막대를 고르면 질문 목록은 그대로 두고 댓글 목록만 거릅니다 (질문은 역량을 보지 않음).
      var commentOnly = state.pick && state.pick.type === 'comp';
      renderQuestions(commentOnly ? posts : posts.filter(matchesPick));
      renderComments(comments.filter(matchesPick));
    }

    function renderStats(posts, comments) {
      var authors = {};
      posts.forEach(function (p) { authors[p.author] = 1; });
      var box = $('stats');
      box.innerHTML = '';
      var leveled = posts.concat(comments).filter(function (p) { return p.level; });
      var high = leveled.filter(function (p) { return HIGH_LEVELS.indexOf(p.level) !== -1; }).length;
      [['질문', posts.length + '개'], state.student ? null : ['질문한 학생', Object.keys(authors).length + '명'],
        ['학생 댓글', comments.length + '개'],
        leveled.length ? ['높은 수준(분석·종합·평가) 질문·댓글', Math.round(high / leveled.length * 100) + '%'] : null
      ].forEach(function (s) {
        if (s) box.appendChild(el('div', { cls: 'stat' }, [el('b', { text: s[1] }), s[0]]));
      });
    }

    /** keys 순서대로 고정 색을 줍니다. 8개를 넘는 항목은 회색 '기타'로 묶고, 미분류는 맨 뒤에 회색으로 둡니다. */
    function slicesFor(keys, counts, keepEmpty) {
      var slices = [], other = 0;
      keys.forEach(function (k, i) {
        if (!counts[k] && !keepEmpty) return;
        if (i < SLOTS.length) slices.push({ key: k, label: k, count: counts[k] || 0, color: SLOTS[i] });
        else other += counts[k];
      });
      if (other) slices.push({ key: '기타', label: '기타', count: other, color: 'var(--none)', noPick: true });
      if (counts[NONE]) slices.push({ key: NONE, label: NONE, count: counts[NONE], color: 'var(--none)' });
      return slices;
    }

    function renderCategory(posts) {
      var counts = {};
      posts.forEach(function (p) { var k = p.category || NONE; counts[k] = (counts[k] || 0) + 1; });
      bars($('cCategory'), slicesFor(data.categories, counts, true), posts.length, 'category', '', true);
    }

    /** 학생 댓글만 셉니다. 막대 길이는 전체 학생 댓글 중 비율입니다. */
    function renderComp(posts) {
      var counts = {};
      posts.forEach(function (p) {
        if (p.noCompetency) counts[NOCOMP] = (counts[NOCOMP] || 0) + 1;
        else if (!p.competencies.length) counts[NONE] = (counts[NONE] || 0) + 1;
        p.competencies.forEach(function (c) { counts[c] = (counts[c] || 0) + 1; });
      });
      // 역량과 '드러난 역량 없음'은 0개라도 항상 모두 보여 줍니다.
      var slices = slicesFor(data.competencies.map(function (c) { return c.name; }), counts, true);
      var at = slices.length && slices[slices.length - 1].key === NONE ? slices.length - 1 : slices.length;
      slices.splice(at, 0, { key: NOCOMP, label: NOCOMP, count: counts[NOCOMP] || 0, color: 'var(--nocomp)' });
      bars($('cComp'), slices, posts.length, 'comp', '', true);
    }

    /** 인지적 수준은 순서가 있는 단계라, 비어 있는 단계도 순서대로 모두 보여 주고 높을수록 진한 색으로 칠합니다. */
    function renderLevels(posts) {
      var counts = {};
      posts.forEach(function (p) { var k = p.level || NONE; counts[k] = (counts[k] || 0) + 1; });
      var rows = data.levels.map(function (l, i) {
        return { key: l.name, label: l.name, count: counts[l.name] || 0, desc: l.desc, color: 'var(--l' + (i + 1) + ')' };
      });
      if (counts[NONE]) rows.push({ key: NONE, label: NONE, count: counts[NONE], desc: '아직 분류되지 않은 질문', color: 'var(--none)' });
      bars($('cLevel'), rows, posts.length, 'level', '', true);
    }

    /** 과목마다 대단원을 모두 보여 줍니다. 질문이 없는 대단원·과목도 0개 · 0%로 나옵니다. */
    function renderUnits(posts) {
      var box = $('cUnits');
      box.innerHTML = '';
      data.categories.forEach(function (cat) {
        if (state.subject && state.subject !== cat) return;
        var mine = posts.filter(function (p) { return p.category === cat; });
        var counts = {};
        mine.forEach(function (p) { var k = p.unit || NONE; counts[k] = (counts[k] || 0) + 1; });
        var wrap = el('div', {}, [el('h3', { text: cat + ' · ' + mine.length + '개' })]);
        var holder = el('div');
        wrap.appendChild(holder);
        box.appendChild(wrap);
        bars(holder, slicesFor(data.units[cat] || [], counts, true), mine.length, 'unit', cat, true);
      });
    }

    /**
     * 가로 막대그래프. 막대 길이는 전체 질문 대비 비율이고, 줄을 누르면 질문 목록이 그 항목으로 걸러집니다.
     * keepEmpty가 아니면 0개인 항목은 숨깁니다.
     */
    function bars(box, rows, total, type, subject, keepEmpty) {
      box.innerHTML = '';
      if (!keepEmpty) rows = rows.filter(function (r) { return r.count; });
      if (!rows.length || (!total && !keepEmpty)) { box.appendChild(el('div', { cls: 'empty', text: '표시할 질문이 없어요.' })); return; }
      var pick = state.pick && state.pick.type === type && (state.pick.subject || '') === (subject || '') ? state.pick.value : null;
      var wrap = el('div', { cls: 'bars' + (pick ? ' has-pick' : ''), role: 'list' });
      rows.forEach(function (r) {
        var row = el('div', { cls: 'brow' + (r.noPick ? '' : ' pickable') + (pick === r.key ? ' on' : ''), role: 'listitem' }, [
          el('span', { cls: 'name', text: r.label }),
          el('div', { cls: 'track' }, [el('div', { cls: 'bar', style: 'width:' + (total ? Math.min(100, r.count / total * 100) : 0) + '%;background:' + r.color })]),
          el('span', { cls: 'n', text: r.count + '개 · ' + pct(r.count, total) })
        ]);
        if (!r.noPick) row.addEventListener('click', function () { setPick({ type: type, value: r.key, subject: subject }); });
        hover(row, r, total);
        wrap.appendChild(row);
      });
      box.appendChild(wrap);
    }
    function pct(n, total) { return (total ? Math.round(n / total * 100) : 0) + '%'; }
    function hover(node, s, total) {
      var tip = $('tip');
      node.addEventListener('mousemove', function (e) {
        tip.textContent = s.label + ' · ' + s.count + '개 (' + pct(s.count, total) + ')' + (s.desc ? '\n' + s.desc : '');
        tip.style.display = 'block';
        tip.style.left = Math.min(e.clientX + 12, window.innerWidth - tip.offsetWidth - 8) + 'px';
        tip.style.top = (e.clientY + 12) + 'px';
      });
      node.addEventListener('mouseleave', function () { tip.style.display = 'none'; });
    }

    function topKey(counts) {
      var best = '', n = 0;
      Object.keys(counts).forEach(function (k) { if (counts[k] > n) { best = k; n = counts[k]; } });
      return best;
    }

    function renderStudents(posts, comments) {
      $('studentsPanel').hidden = !!state.student;
      if (state.student) return;
      var by = {};
      posts.forEach(function (p) {
        var s = student(by, p.author);
        s.n++;
        if (p.category) s.cat[p.category] = (s.cat[p.category] || 0) + 1;
        if (p.level) {
          s.lv[p.level] = (s.lv[p.level] || 0) + 1;
          s.leveled++;
          if (HIGH_LEVELS.indexOf(p.level) !== -1) s.high++;
        }
      });
      comments.forEach(function (c) {
        var s = student(by, c.author);
        s.nc++;
        c.competencies.forEach(function (x) { s.comp[x] = (s.comp[x] || 0) + 1; });
        if (c.level) {
          s.lv[c.level] = (s.lv[c.level] || 0) + 1;
          s.leveled++;
          if (HIGH_LEVELS.indexOf(c.level) !== -1) s.high++;
        }
      });
      var rows = Object.keys(by).map(function (k) { return by[k]; })
        .sort(function (a, b) { return b.n - a.n || b.nc - a.nc || a.name.localeCompare(b.name, 'ko'); });
      var t = $('students');
      t.innerHTML = '';
      t.appendChild(el('tr', {}, ['이름', '질문', '댓글', '많이 물은 과목', '주로 드러난 역량', '주된 인지적 수준', '높은 수준 질문 비중'].map(function (h) { return el('th', { text: h }); })));
      if (!rows.length) { t.appendChild(el('tr', {}, [el('td', { colspan: 7, cls: 'empty', text: '질문이 없어요.' })])); return; }
      rows.forEach(function (s) {
        t.appendChild(el('tr', { cls: 'click', onclick: function () { state.student = s.name; state.pick = null; render(); window.scrollTo(0, 0); } }, [
          el('td', { cls: 'nw', text: s.name }), el('td', { cls: 'num', text: String(s.n) }), el('td', { cls: 'num', text: String(s.nc) }),
          el('td', { text: topKey(s.cat) || '-' }), el('td', { text: topKey(s.comp) || '-' }),
          el('td', { cls: 'nw', text: topKey(s.lv) || '-' }),
          el('td', { cls: 'num', text: s.leveled ? pct(s.high, s.leveled) : '-' })
        ]));
      });
    }

    /**
     * 과목 칸과 대단원 칸 (두 칸). 드롭다운으로 고르거나 바꿉니다.
     * 댓글은 원래 질문의 분류를 따르므로, 댓글 줄에서 바꾸면 원래 질문(과 그 질문의 모든 댓글)이 바뀝니다.
     */
    function subjectCells(item) {
      var p = item.kind === 'comment' ? postById(item.postId) : item;
      if (!p) return [el('td', { cls: 'nw', text: item.category || NONE }), el('td', { cls: 'nw', text: item.unit || '-' })];
      var cat = el('td', { cls: 'nw' }, [fixSelect(p, 'category', '과목 고르기', data.categories.map(function (c) { return [c, c]; }), p.category)]);
      var units = data.units[p.category] || [];
      var unit = p.category && units.length
        ? el('td', { cls: 'nw' }, [fixSelect(p, 'unit', '대단원 고르기', units.map(function (u) { return [u, u]; }), p.unit)])
        : el('td', { cls: 'muted-cell', text: p.category ? '-' : '과목을 먼저 골라 주세요' });
      return [cat, unit];
    }

    /**
     * 분류 드롭다운. 미분류면 점선으로 눈에 띄게, 이미 분류된 것은 현재 값이 골라진 채로 보이고 바꿀 수 있습니다.
     * 고르면 바로 시트에 저장합니다.
     */
    function fixSelect(item, field, placeholder, options, current) {
      var sel = el('select', { cls: 'fix' + (current ? ' done' : ''), 'aria-label': placeholder });
      if (!current) sel.appendChild(el('option', { value: '', text: placeholder + ' ▾' }));
      options.forEach(function (o) { sel.appendChild(el('option', { value: o[0], text: o[1] })); });
      sel.value = current || '';
      var wrap = el('span', {}, [sel]);
      sel.addEventListener('change', function () {
        if (!sel.value || sel.value === current) return;
        sel.disabled = true;
        save(item, field, sel.value, wrap, function () { sel.disabled = false; sel.value = current || ''; });
      });
      return wrap;
    }

    /** 역량 칸: 누르면 체크박스 목록이 열리고, 여러 개를 골라 저장합니다. '드러난 역량 없음'은 다른 것과 함께 고를 수 없습니다. */
    function compPicker(item) {
      var empty = !item.competencies.length && !item.noCompetency;
      var wrap = el('span', { cls: 'cpick' + (empty ? ' empty' : '') });
      var label = item.competencies.length ? item.competencies.join(', ') : item.noCompetency ? '없음' : '역량 고르기';
      var btn = el('button', { type: 'button', text: label + ' ▾', 'aria-haspopup': 'true' });
      wrap.appendChild(btn);
      btn.addEventListener('click', function () {
        var open = wrap.querySelector('.menu');
        document.querySelectorAll('.cpick .menu').forEach(function (m) { m.remove(); });
        if (open) return;
        var menu = el('div', { cls: 'menu' });
        var boxes = data.competencies.map(function (c) {
          var cb = el('input', { type: 'checkbox', value: c.name });
          cb.checked = item.competencies.indexOf(c.name) !== -1;
          menu.appendChild(el('label', {}, [cb, c.name]));
          return cb;
        });
        var none = el('input', { type: 'checkbox', value: '없음' });
        none.checked = item.noCompetency;
        menu.appendChild(el('label', { cls: 'none' }, [none, NOCOMP]));
        none.addEventListener('change', function () { if (none.checked) boxes.forEach(function (b) { b.checked = false; }); });
        boxes.forEach(function (b) { b.addEventListener('change', function () { if (b.checked) none.checked = false; }); });
        var ok = el('button', { type: 'button', text: '저장' });
        var cancel = el('button', { type: 'button', cls: 'ghost', text: '닫기', onclick: function () { menu.remove(); } });
        ok.addEventListener('click', function () {
          var picked = boxes.filter(function (b) { return b.checked; }).map(function (b) { return b.value; });
          var value = none.checked ? '없음' : picked.join(', ');
          if (!value) { menu.remove(); return; }
          ok.disabled = true;
          save(item, 'competencies', value, wrap, function () { ok.disabled = false; });
        });
        menu.appendChild(el('div', { cls: 'row' }, [cancel, ok]));
        wrap.appendChild(menu);
        // 표 칸에 잘리지 않게 화면 기준으로 띄웁니다 (아래 공간이 부족하면 위로). 스크롤하면 버튼을 따라갑니다.
        menu.place = function () {
          var r = btn.getBoundingClientRect();
          var h = menu.offsetHeight;
          menu.style.left = Math.max(8, Math.min(r.left, window.innerWidth - menu.offsetWidth - 8)) + 'px';
          menu.style.top = (r.bottom + 4 + h > window.innerHeight ? Math.max(8, r.top - 4 - h) : r.bottom + 4) + 'px';
        };
        menu.place();
      });
      return wrap;
    }

    function save(item, field, value, wrap, onFail) {
      google.script.run
        .withSuccessHandler(function (saved) { applyFix(item, field, saved); render(); })
        .withFailureHandler(function (err) {
          onFail();
          var old = wrap.querySelector('.fix-err');
          if (old) old.remove();
          wrap.appendChild(el('span', { cls: 'fix-err', text: (err && err.message || String(err)).replace(/^Error:\s*/, '') }));
        })
        .setClassification(load('teacherPw'), item.kind, item.id, field, value);
    }

    /** 저장된 분류를 화면 데이터에도 반영합니다 (다시 불러오지 않고 바로 그래프에 반영). */
    function applyFix(item, field, saved) {
      if (field === 'competencies') {
        item.noCompetency = saved === '없음';
        item.competencies = item.noCompetency ? [] : saved.split(', ');
        return;
      }
      item[field] = saved;
      if (field === 'category') {
        if ((data.units[saved] || []).indexOf(item.unit) === -1) item.unit = '';
        data.comments.forEach(function (c) { if (c.postId === item.id) { c.category = item.category; c.unit = item.unit; } });
      }
      if (field === 'unit') data.comments.forEach(function (c) { if (c.postId === item.id) c.unit = saved; });
    }

    function postById(id) {
      for (var i = 0; i < data.posts.length; i++) if (data.posts[i].id === id) return data.posts[i];
      return null;
    }

    function student(by, name) {
      return by[name] = by[name] || { name: name, n: 0, nc: 0, cat: {}, comp: {}, lv: {}, high: 0, leveled: 0 };
    }

    function pickNote(box, what) {
      box.innerHTML = '';
      if (!state.pick) return;
      box.appendChild(document.createTextNode('"' + (state.pick.subject ? state.pick.subject + ' · ' : '') + state.pick.value + '" ' + what + '만 보는 중'));
      box.appendChild(el('button', { cls: 'ghost', text: '전체 보기', onclick: function () { setPick(null); } }));
    }
    function dateCell(p) { return el('td', { cls: 'nw', text: localDate(p.createdAt).slice(5).replace('-', '/') }); }
    function levelCell(p) {
      return el('td', {}, [fixSelect(p, 'level', '수준 고르기', data.levels.map(function (l) { return [l.name, l.name]; }), p.level)]);
    }
    function newestFirst(list) { return list.slice().sort(function (a, b) { return a.createdAt < b.createdAt ? 1 : -1; }); }
    function table(t, heads, rows, emptyText) {
      t.innerHTML = '';
      t.appendChild(el('tr', {}, heads.map(function (h) { return el('th', { text: h }); })));
      if (!rows.length) { t.appendChild(el('tr', {}, [el('td', { colspan: heads.length, cls: 'empty', text: emptyText })])); return; }
      rows.forEach(function (cells) { t.appendChild(el('tr', {}, cells)); });
    }

    /** 질문 목록: 과목 · 대단원 · 인지적 수준 */
    function renderQuestions(posts) {
      if (state.pick && state.pick.type === 'comp') $('pickNote').innerHTML = ''; // 역량 선택은 댓글 목록에만 적용
      else pickNote($('pickNote'), '질문');
      var heads = ['날짜'].concat(state.student ? [] : ['이름']).concat(['과목', '대단원', '인지적 수준', '질문']);
      table($('questions'), heads, newestFirst(posts).map(function (p) {
        var cells = [dateCell(p)];
        if (!state.student) cells.push(el('td', { cls: 'nw', text: p.author }));
        cells = cells.concat(subjectCells(p));
        cells.push(levelCell(p));
        cells.push(el('td', { cls: 'q', text: p.text + (p.followUps ? '  (후속 댓글 ' + p.followUps + ')' : '') }));
        return cells;
      }), '해당하는 질문이 없어요.');
    }

    /** 댓글 목록: 원래 질문의 과목 · 대단원, 인지적 수준, 사회과 교과 역량 */
    function renderComments(comments) {
      pickNote($('pickNoteC'), '댓글');
      var heads = ['날짜'].concat(state.student ? [] : ['이름']).concat(['과목', '대단원', '인지적 수준', '사회과 교과 역량', '댓글']);
      table($('comments'), heads, newestFirst(comments).map(function (c) {
        var cells = [dateCell(c)];
        if (!state.student) cells.push(el('td', { cls: 'nw', text: c.author }));
        cells = cells.concat(subjectCells(c));
        cells.push(levelCell(c), el('td', {}, [compPicker(c)]));
        cells.push(el('td', { cls: 'q', text: c.text }));
        return cells;
      }), '해당하는 댓글이 없어요.');
    }
  </script>
</body>
</html>
