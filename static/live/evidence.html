<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>탈퇴자 증빙 · 외솔온닷</title>
  <link rel="icon" href="/static/live/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#1b6b4a"><link rel="apple-touch-icon" href="/static/live/icons/apple-touch-icon.png"><script src="/static/live/pwa.js" defer></script>
  <link rel="stylesheet" href="/static/live/live.css">
</head>
<body class="site">
  <main class="landing doc">
    <h1>탈퇴자 증빙</h1>
    <p>수업 증빙에 필요한 경우에만 조회하세요. 목록·열람·다운로드 사유와 시각이 기록됩니다.</p>
    <p id="policy" class="banner warn" hidden></p>
    <label>조회 사유
      <select id="purpose">
        <option value="">사유 선택</option>
        <option value="record_check">수업 기록 확인</option>
        <option value="certificate">증빙서류 발급</option>
        <option value="appeal">이의 신청 처리</option>
      </select>
    </label>
    <label>학교 <input id="school" maxlength="60" placeholder="전체 또는 학교명"></label>
    <button id="search" type="button">조회</button>
    <p id="error" role="alert"></p>
    <div id="results"></div>
    <section id="detail" hidden>
      <h2>증빙 기록</h2>
      <a id="download" href="#">ZIP 내려받기</a>
      <pre id="record" style="white-space:pre-wrap;overflow-wrap:anywhere"></pre>
    </section>
  </main>
  <script src="/static/live/evidence.js"></script>
  <script src="/static/live/site.js"></script>
</body>
</html>
