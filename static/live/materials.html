<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>지난 수업 자료</title>
  <link rel="icon" href="/static/live/favicon.svg" type="image/svg+xml">

  <script src="/static/live/common.js"></script>
